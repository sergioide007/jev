<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">evaluateGate: from probabilities to a verdict</title><desc id="d">The deny rule, five accumulating rules, and the resulting allow or ask_user verdict.</desc><defs><marker id="a-374151" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="as-374151" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a-B83227" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B83227"/></marker><marker id="as-B83227" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B83227"/></marker><marker id="a-B86E00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B86E00"/></marker><marker id="as-B86E00" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B86E00"/></marker><marker id="a-2E7D4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D4F"/></marker><marker id="as-2E7D4F" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D4F"/></marker><marker id="a-4B55C9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B55C9"/></marker><marker id="as-4B55C9" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B55C9"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="30" y="42" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="25" font-weight="bold" fill="#1F2937" text-anchor="start">evaluateGate(): how four probabilities and one fact become a verdict</text><text x="30" y="68" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#4B5563" text-anchor="start">Rules are evaluated in this order; the returned reasons always include the strongest one that applied.</text><rect x="30" y="105" width="290" height="150" rx="10" fill="#EEF0FF" stroke="#4B55C9" stroke-width="1.6"/><text x="44" y="131" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="start">Signals from Jev</text><text x="44" y="154" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">destructive → Noul 0–1</text><text x="44" y="175" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">outside_scope → Noul 0–1</text><text x="44" y="196" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">reversibility → Score 0–2</text><text x="44" y="217" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">blast_radius → Choice + probs</text><rect x="30" y="335" width="290" height="108" rx="10" fill="#E9F5EC" stroke="#2E7D4F" stroke-width="1.6"/><text x="44" y="361" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="start">From your code (a fact)</text><text x="44" y="384" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">tool.effect</text><text x="44" y="405" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">read · write · delete · network</text><text x="44" y="426" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">declared at registration</text><path d="M 320 146 L 352 146" fill="none" stroke="#374151" stroke-width="1.9" marker-end="url(#a-374151)"/><path d="M 320 226 L 336 226 L 336 330 L 352 330" fill="none" stroke="#374151" stroke-width="1.9" marker-end="url(#a-374151)"/><path d="M 320 390 L 352 390" fill="none" stroke="#2E7D4F" stroke-width="1.9" marker-end="url(#a-2E7D4F)"/><rect x="352" y="105" width="540" height="82" rx="10" fill="#FDECEC" stroke="#B83227" stroke-width="1.6"/><text x="366" y="131" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="start">0 · DENY</text><text x="366" y="154" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">destructive ≥ 0.9  AND  blast radius (argmax) ∈ {system, external}</text><text x="366" y="175" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">not a judgement call: no human is asked</text><path d="M 892 146 L 935 146" fill="none" stroke="#B83227" stroke-width="1.9" marker-end="url(#a-B83227)"/><rect x="935" y="105" width="235" height="82" rx="10" fill="#FDECEC" stroke="#B83227" stroke-width="1.6"/><text x="949" y="131" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="start">deny</text><text x="949" y="154" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">never executed</text><text x="949" y="175" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">run stops: denied</text><text x="352" y="222" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#4B5563" text-anchor="start">otherwise: collect every rule that fires</text><rect x="352" y="234" width="540" height="348" rx="12" fill="#FFFAF0" stroke="#B86E00" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="368" y="248" width="508" height="58" rx="10" fill="#FFF3DC" stroke="#B86E00" stroke-width="1.6"/><text x="382" y="274" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="bold" fill="#1F2937" text-anchor="start">1 · irreversible</text><text x="382" y="297" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">reversibility &gt; 1.5  (irreversible or externally visible)</text><rect x="368" y="314" width="508" height="58" rx="10" fill="#FFF3DC" stroke="#B86E00" stroke-width="1.6"/><text x="382" y="340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="bold" fill="#1F2937" text-anchor="start">2 · severe scope</text><text x="382" y="363" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">blast radius (argmax) ∈ {system, external}</text><rect x="368" y="380" width="508" height="58" rx="10" fill="#FFF3DC" stroke="#B86E00" stroke-width="1.6"/><text x="382" y="406" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="bold" fill="#1F2937" text-anchor="start">3 · severe mass</text><text x="382" y="429" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">P(system) + P(external) ≥ 0.30, even if the argmax looks safe</text><rect x="828.4" y="389" width="38" height="20" rx="10" fill="#B83227"/><text x="847.2" y="403.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">NEW</text><rect x="368" y="446" width="508" height="58" rx="10" fill="#FFF3DC" stroke="#B86E00" stroke-width="1.6"/><text x="382" y="472" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="bold" fill="#1F2937" text-anchor="start">4 · destructive and off-task</text><text x="382" y="495" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">destructive &gt; 0.6  AND  outside_scope &gt; 0.5</text><rect x="368" y="512" width="508" height="58" rx="10" fill="#FFF3DC" stroke="#B86E00" stroke-width="1.6"/><text x="382" y="538" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="bold" fill="#1F2937" text-anchor="start">5 · declared effect</text><text x="382" y="561" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">tool.effect ∈ alwaysAskEffects (default: delete)</text><rect x="828.4" y="521" width="38" height="20" rx="10" fill="#B83227"/><text x="847.2" y="535.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">NEW</text><path d="M 622 582 L 622 612" fill="none" stroke="#374151" stroke-width="1.9" marker-end="url(#a-374151)"/><polygon points="622,614 772,672 622,730 472,672" fill="#F4F5F7" stroke="#6B7280" stroke-width="1.6"/><text x="622" y="677" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="bold" fill="#1F2937" text-anchor="middle">any rule fired?</text><path d="M 772 672 L 935 672" fill="none" stroke="#B86E00" stroke-width="1.9" marker-end="url(#a-B86E00)"/><rect x="836" y="651" width="34" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="853" y="664" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#B86E00" text-anchor="middle">yes</text><rect x="935" y="632" width="235" height="80" rx="10" fill="#FFF3DC" stroke="#B86E00" stroke-width="1.6"/><text x="949" y="658" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="start">ask_user</text><text x="949" y="681" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">EscalationHandler</text><text x="949" y="702" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">default: deny</text><path d="M 472 672 L 335 672" fill="none" stroke="#2E7D4F" stroke-width="1.9" marker-end="url(#a-2E7D4F)"/><rect x="390" y="651" width="26" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="403" y="664" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#2E7D4F" text-anchor="middle">no</text><rect x="105" y="632" width="230" height="80" rx="10" fill="#E9F5EC" stroke="#2E7D4F" stroke-width="1.6"/><text x="119" y="658" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="start">allow</text><text x="119" y="681" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">execute in the sandbox</text><text x="119" y="702" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">then JUDGE</text><text x="30" y="762" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#4B5563" text-anchor="start">Thresholds live only in policy.ts. They are coupled to jev-1.13.0's distribution: re-measure calibration on your own labelled data before tuning.</text><rect x="30" y="772" width="14" height="14" rx="3" fill="#B83227" stroke="#B83227" stroke-width="1.6"/><text x="50" y="784" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="normal" fill="#4B5563" text-anchor="start">= added or changed in review</text></svg>
