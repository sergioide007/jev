<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1010" viewBox="0 0 1140 1010" role="img" aria-labelledby="t d"><title id="t">Jev agent control layer: one step of the loop</title><desc id="d">Select, gate, execute, judge: the decision points, thresholds and stop reasons of a single iteration.</desc><defs><marker id="a-374151" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="as-374151" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a-B83227" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B83227"/></marker><marker id="as-B83227" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B83227"/></marker><marker id="a-B86E00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B86E00"/></marker><marker id="as-B86E00" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B86E00"/></marker><marker id="a-2E7D4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D4F"/></marker><marker id="as-2E7D4F" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D4F"/></marker><marker id="a-4B55C9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B55C9"/></marker><marker id="as-4B55C9" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B55C9"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="30" y="42" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="25" font-weight="bold" fill="#1F2937" text-anchor="start">One step of the control loop</text><text x="30" y="68" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#4B5563" text-anchor="start">Every arrow out of a diamond is decided by a threshold in policy.ts, never by the model alone.</text><rect x="370" y="100" width="300" height="82" rx="10" fill="#EEF0FF" stroke="#4B55C9" stroke-width="1.6"/><text x="384" y="126" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="start">1 · SELECT</text><text x="384" y="149" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">one Choice over the tool catalogue</text><text x="384" y="170" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">then bind arguments (plain code)</text><path d="M 520 182 L 520 212" fill="none" stroke="#374151" stroke-width="1.9" marker-end="url(#a-374151)"/><polygon points="520,212 670,262 520,312 370,262" fill="#F4F5F7" stroke="#6B7280" stroke-width="1.6"/><text x="520" y="257" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="bold" fill="#1F2937" text-anchor="middle">selection confidence</text><text x="520" y="277" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="middle">≥ 0.6 ?</text><path d="M 670 262 L 790 262" fill="none" stroke="#B83227" stroke-width="1.9" marker-end="url(#a-B83227)"/><rect x="717" y="241" width="26" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="730" y="254" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#B83227" text-anchor="middle">no</text><rect x="790" y="227" width="300" height="70" rx="10" fill="#FDECEC" stroke="#B83227" stroke-width="1.6"/><text x="804" y="253" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="start">STOP · escalated</text><text x="804" y="276" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">no clear winner: ask, don't guess</text><path d="M 520 312 L 520 344" fill="none" stroke="#374151" stroke-width="1.9" marker-end="url(#a-374151)"/><rect x="525" y="321" width="34" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="542" y="334" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#4B5563" text-anchor="middle">yes</text><rect x="370" y="344" width="300" height="112" rx="10" fill="#EEF0FF" stroke="#4B55C9" stroke-width="1.6"/><text x="384" y="370" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="start">2 · GATE  (1 round trip)</text><text x="384" y="393" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">destructive · outside_scope (Noul)</text><text x="384" y="414" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">reversibility (Score 0–2)</text><text x="384" y="435" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">blast_radius (Choice + distribution)</text><path d="M 520 456 L 520 486" fill="none" stroke="#374151" stroke-width="1.9" marker-end="url(#a-374151)"/><polygon points="520,486 670,546 520,606 370,546" fill="#F4F5F7" stroke="#6B7280" stroke-width="1.6"/><text x="520" y="541" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="bold" fill="#1F2937" text-anchor="middle">evaluateGate()</text><text x="520" y="561" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="middle">policy.ts</text><path d="M 670 546 L 790 546" fill="none" stroke="#B83227" stroke-width="1.9" marker-end="url(#a-B83227)"/><rect x="709" y="525" width="42" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="730" y="538" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#B83227" text-anchor="middle">deny</text><rect x="790" y="506" width="300" height="80" rx="10" fill="#FDECEC" stroke="#B83227" stroke-width="1.6"/><text x="804" y="532" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="start">STOP · denied</text><text x="804" y="555" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">hard delete on system/external:</text><text x="804" y="576" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">never executed, never escalated</text><path d="M 370 546 L 330 546" fill="none" stroke="#B86E00" stroke-width="1.9" marker-end="url(#a-B86E00)"/><rect x="333" y="525" width="34" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="350" y="538" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#B86E00" text-anchor="middle">ask</text><rect x="90" y="494" width="240" height="104" rx="10" fill="#FFF3DC" stroke="#B86E00" stroke-width="1.6"/><text x="104" y="520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="start">EscalationHandler</text><text x="104" y="543" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">human approves?</text><text x="104" y="564" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">refusal or no answer →</text><text x="104" y="585" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">STOP · escalated</text><path d="M 210 598 L 210 668 L 370 668" fill="none" stroke="#B86E00" stroke-width="1.9" marker-end="url(#a-B86E00)"/><rect x="225" y="647" width="74" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="262" y="660" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#B86E00" text-anchor="middle">approved</text><path d="M 520 606 L 520 638" fill="none" stroke="#2E7D4F" stroke-width="1.9" marker-end="url(#a-2E7D4F)"/><rect x="521" y="615" width="50" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="546" y="628" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#2E7D4F" text-anchor="middle">allow</text><rect x="370" y="638" width="300" height="64" rx="10" fill="#E9F5EC" stroke="#2E7D4F" stroke-width="1.6"/><text x="384" y="664" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="start">EXECUTE</text><text x="384" y="687" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">sandboxed tool; failure = result</text><path d="M 520 702 L 520 732" fill="none" stroke="#374151" stroke-width="1.9" marker-end="url(#a-374151)"/><rect x="370" y="732" width="300" height="82" rx="10" fill="#EEF0FF" stroke="#4B55C9" stroke-width="1.6"/><text x="384" y="758" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="start">3 · JUDGE  (1 round trip)</text><text x="384" y="781" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">complete · looping (Noul)</text><text x="384" y="802" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">progress (Score 0–2)</text><path d="M 520 814 L 520 844" fill="none" stroke="#374151" stroke-width="1.9" marker-end="url(#a-374151)"/><polygon points="520,844 670,904 520,964 370,904" fill="#F4F5F7" stroke="#6B7280" stroke-width="1.6"/><text x="520" y="899" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="bold" fill="#1F2937" text-anchor="middle">evaluateLoop()</text><text x="520" y="919" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="middle">policy.ts</text><path d="M 370 904 L 45 904 L 45 141 L 370 141" fill="none" stroke="#374151" stroke-width="1.9" marker-end="url(#a-374151)"/><rect x="83" y="883" width="74" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="120" y="896" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#4B5563" text-anchor="middle">continue</text><path d="M 670 904 L 790 904" fill="none" stroke="#2E7D4F" stroke-width="1.9" marker-end="url(#a-2E7D4F)"/><rect x="709" y="883" width="42" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="730" y="896" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#2E7D4F" text-anchor="middle">stop</text><rect x="790" y="846" width="320" height="116" rx="10" fill="#E9F5EC" stroke="#2E7D4F" stroke-width="1.6"/><text x="804" y="872" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="start">Stop conditions, in order</text><text x="804" y="894" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">1. steps ≥ 8 → step_limit</text><text x="804" y="913" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">2. complete ≥ 0.85 → complete</text><text x="804" y="932" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">3. looping ≥ 0.7 and progress &lt; 0.6</text><text x="804" y="951" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">    → loop_detected</text><text x="30" y="990" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#4B5563" text-anchor="start">Every decision is written to trace.ts as JSON Lines: full probability distribution, versioned model id, tokens and cost.</text></svg>
