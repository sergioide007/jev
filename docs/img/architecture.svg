ser calls</text><text x="44" y="411" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">no answer = deny</text><rect x="30" y="452" width="205" height="100" rx="10" fill="#F4F5F7" stroke="#6B7280" stroke-width="1.6"/><text x="44" y="478" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="start">Result</text><text x="44" y="501" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">AgentRun: stopReason,</text><text x="44" y="522" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">steps, transcript</text><text x="44" y="543" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">or AgentError + trail</text><path d="M 235 168 L 262 168" fill="none" stroke="#374151" stroke-width="1.9" marker-end="url(#a-374151)"/><path d="M 262 375 L 235 375" fill="none" stroke="#B86E00" stroke-width="1.9" marker-end="url(#a-B86E00)" marker-start="url(#as-B86E00)"/><path d="M 262 502 L 235 502" fill="none" stroke="#374151" stroke-width="1.9" marker-end="url(#a-374151)"/><rect x="262" y="105" width="545" height="440" rx="14" fill="#FBFBFC" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="6 5"/><text x="280" y="132" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="start">AGENT LOOP · agent.ts</text><text x="280" y="152" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#4B5563" text-anchor="start">orchestration and I/O only; no threshold lives here</text><rect x="285" y="180" width="240" height="100" rx="10" fill="#EEF0FF" stroke="#4B55C9" stroke-width="1.6"/><text x="299" y="206" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="start">1 · SELECT</text><text x="299" y="229" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">one Choice over the catalogue</text><text x="299" y="250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">confidence &lt; 0.6 → escalate</text><rect x="545" y="180" width="240" height="100" rx="10" fill="#EEF0FF" stroke="#4B55C9" stroke-width="1.6"/><text x="559" y="206" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="start">2 · GATE</text><text x="559" y="229" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">4 questions, 1 round trip</text><text x="559" y="250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">allow · ask_user · deny</text><rect x="545" y="350" width="240" height="100" rx="10" fill="#E9F5EC" stroke="#2E7D4F" stroke-width="1.6"/><text x="559" y="376" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="start">EXECUTE</text><text x="559" y="399" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">sandboxed tool call</text><text x="55