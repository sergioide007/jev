, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">tests and offline demo</text><rect x="862" y="326" width="296" height="96" rx="10" fill="#EEF0FF" stroke="#4B55C9" stroke-width="1.6"/><text x="876" y="352" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="start">JevDecider</text><text x="876" y="375" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">@typesafe-ai/sdk</text><text x="876" y="396" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">client.systemOne()</text><text x="876" y="417" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">question set validated first</text><rect x="862" y="456" width="296" height="100" rx="10" fill="#EEF0FF" stroke="#4B55C9" stroke-width="1.6"/><text x="876" y="482" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="start">TypeSafe API</text><text x="876" y="505" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">POST /v1/systemone</text><text x="876" y="526" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">jev-1.13.0 · 70–500 ms</text><text x="876" y="547" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">$0.042/MTok in · output free</text><path d="M 1010 424 L 1